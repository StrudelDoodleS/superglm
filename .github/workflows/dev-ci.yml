name: Dev CI

on:
  push:
    branches-ignore: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    # ty is intentionally advisory until the existing source backlog is cleared.
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --python 3.13 --extra dev

      - name: Advisory ty check
        run: uv run ty check src/superglm --output-format github

  quick-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend modules
        run: npm run check:frontend

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Fast tests
        run: uv run --with pyarrow pytest tests/ -q -m "not slow and not browser" --maxfail=1

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Legacy browser tests
        run: uv run pytest tests/test_editor_browser.py -m browser --run-browser -q

      - name: Workspace browser tests
        run: uv run pytest tests/editor/ -m browser --run-browser -q

      - name: Docs build check
        run: uv sync --group docs --extra plotting && uv run mkdocs build --strict

  py314-full:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --python 3.14 --extra dev

      - name: Full tests (3.14)
        run: uv run pytest tests/ -q -m "not browser" --maxfail=1
