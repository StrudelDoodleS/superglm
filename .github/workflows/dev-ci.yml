name: Dev CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: benchmark contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4

      - name: Install benchmark test dependencies
        run: |
          uv sync --locked --python 3.13 --extra dev
          uv pip install xgboost-cpu==3.4.1 catboost==1.2.10 lightgbm==4.7.0

      - name: Check study and housing benchmark code
        run: |
          uv run --no-sync ruff check benchmarks/psst_*.py benchmarks/test_psst_*.py benchmarks/benchmark_housing_tensor.py benchmarks/test_housing_tensor.py
          uv run --no-sync ruff format --check benchmarks/psst_*.py benchmarks/test_psst_*.py benchmarks/benchmark_housing_tensor.py benchmarks/test_housing_tensor.py

      - name: Test study, interaction and native booster contracts
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          NUMBA_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          BLIS_NUM_THREADS: "1"
        run: >-
          uv run --no-sync pytest benchmarks/test_psst_*.py
          benchmarks/test_housing_tensor.py benchmarks/test_*interaction*.py
          benchmarks/test_broad_partial_audit.py -q

  type-check:
    # The exact backlog is not yet cleared, but increases are blocking.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: >-
          uv sync --locked --python 3.13
          --extra dev --extra bench --extra plotting

      - name: Enforce the accepted ty backlog
        shell: bash
        run: |
          set +e
          uv run ty check src/superglm --output-format concise | tee ty-output.txt
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          ty_status=${pipeline_status[0]}
          tee_status=${pipeline_status[1]}
          if (( tee_status != 0 )); then
            echo "tee failed while capturing ty output"
            exit "$tee_status"
          fi
          if (( ty_status > 1 )); then
            echo "ty exited unexpectedly with status $ty_status"
            exit "$ty_status"
          fi
          if grep -qx "All checks passed!" ty-output.txt; then
            diagnostics=0
          else
            diagnostics=$(sed -En \
              's/^Found ([0-9]+) diagnostics?$/\1/p' \
              ty-output.txt | tail -1)
          fi
          if [[ -z "$diagnostics" ]]; then
            echo "ty did not emit a diagnostic count"
            exit 1
          fi
          if (( diagnostics > 903 )); then
            echo "ty diagnostics increased from the accepted backlog of 903 to $diagnostics"
            exit 1
          fi
          if (( ty_status == 0 && diagnostics != 0 )); then
            echo "ty reported diagnostics with a successful exit status"
            exit 1
          fi
          if (( ty_status != 0 && diagnostics == 0 )); then
            echo "ty failed despite reporting zero diagnostics"
            exit "$ty_status"
          fi

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --python 3.14 --extra dev

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Lockfile check
        run: uv lock --check

      - name: Environment consistency check
        run: uv pip check

      - name: Public smoke test
        run: uv run python run_test.py

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4

      - name: Set up Python
        run: uv python install 3.14

      - name: Install documentation dependencies
        run: uv sync --locked --python 3.14 --group docs --extra plotting

      - name: Docs build check (strict, no execution)
        env:
          SUPERGLM_DOCS_EXECUTE: "off"
        run: uv run sphinx-build -b html -n -W --keep-going -d docs/_build/doctrees docs docs/_build/html

  docs-notebooks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --python 3.14 --extra dev --extra plotting --group docs

      - name: Cache OpenML downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/scikit_learn_data
          key: openml-mtpl2-v1

      - name: Execute documentation notebooks
        run: uv run pytest tests/docs -m docs -q

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend modules
        run: npm run check:frontend

  browser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --python 3.14 --extra dev

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Legacy browser tests
        run: uv run pytest tests/test_editor_browser.py -m browser --run-browser -q

      - name: Workspace browser tests
        run: uv run pytest tests/editor/ -m browser --run-browser -q
