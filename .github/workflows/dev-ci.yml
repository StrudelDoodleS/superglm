name: Dev CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    # The exact backlog is not yet cleared, but increases are blocking.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: >-
          uv sync --locked --python 3.13
          --extra dev --extra bench --extra plotting

      - name: Enforce the accepted ty backlog
        shell: bash
        run: |
          set +e
          uv run ty check src/superglm --output-format concise | tee ty-output.txt
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          ty_status=${pipeline_status[0]}
          tee_status=${pipeline_status[1]}
          if (( tee_status != 0 )); then
            echo "tee failed while capturing ty output"
            exit "$tee_status"
          fi
          if (( ty_status > 1 )); then
            echo "ty exited unexpectedly with status $ty_status"
            exit "$ty_status"
          fi
          if grep -qx "All checks passed!" ty-output.txt; then
            diagnostics=0
          else
            diagnostics=$(sed -En \
              's/^Found ([0-9]+) diagnostics?$/\1/p' \
              ty-output.txt | tail -1)
          fi
          if [[ -z "$diagnostics" ]]; then
            echo "ty did not emit a diagnostic count"
            exit 1
          fi
          if (( diagnostics > 903 )); then
            echo "ty diagnostics increased from the accepted backlog of 903 to $diagnostics"
            exit 1
          fi
          if (( ty_status == 0 && diagnostics != 0 )); then
            echo "ty reported diagnostics with a successful exit status"
            exit 1
          fi
          if (( ty_status != 0 && diagnostics == 0 )); then
            echo "ty failed despite reporting zero diagnostics"
            exit "$ty_status"
          fi

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --python 3.14 --extra dev

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Lockfile check
        run: uv lock --check

      - name: Environment consistency check
        run: uv pip check

      - name: Public smoke test
        run: uv run python run_test.py

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Set up Python
        run: uv python install 3.14

      - name: Install documentation dependencies
        run: uv sync --python 3.14 --group docs --extra plotting

      - name: Docs build check
        run: uv run mkdocs build --strict

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend modules
        run: npm run check:frontend

  browser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --python 3.14 --extra dev

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Legacy browser tests
        run: uv run pytest tests/test_editor_browser.py -m browser --run-browser -q

      - name: Workspace browser tests
        run: uv run pytest tests/editor/ -m browser --run-browser -q

  pytest-314:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1
            label: Python 3.14 · non-browser regression suite · balanced A
          - group: 2
            label: Python 3.14 · non-browser regression suite · balanced B
          - group: 3
            label: Python 3.14 · non-browser regression suite · balanced C
          - group: 4
            label: Python 3.14 · non-browser regression suite · balanced D

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --python 3.14 --extra dev

      - name: Run ${{ matrix.label }}
        run: >-
          uv run --with pyarrow --with mpmath pytest tests/ -q -m "not browser" --maxfail=1
          --splits 4 --group ${{ matrix.group }}
          --splitting-algorithm least_duration

  pytest-312:
    # Covers the declared floor (pyproject requires-python = ">=3.12") and is the
    # only job that installs every tested extra. The context is not in the
    # "Protect master" ruleset yet: the policy is strict, so requiring a context
    # that the already-open pull requests have never reported would block them.
    # Add the check-run name below to the ruleset once they have merged (#227).
    name: Python 3.12 · non-browser suite · version floor
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install all tested optional dependencies
        run: uv sync --python 3.12 --extra dev --extra bench --extra plotting

      - name: Run the complete non-browser suite
        run: uv run pytest tests/ -q -m "not browser" --maxfail=1
