name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "src/**"
      - "README.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-deploy
  # Never cancel an in-flight production deploy; queued runs still serialise.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4

      - run: uv python install 3.14

      - name: Install docs dependencies
        run: uv sync --locked --python 3.14 --group docs --extra plotting

      - name: Cache OpenML downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/scikit_learn_data
          key: openml-mtpl2-v1

      - name: Cache executed notebooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: docs/_build/.jupyter_cache
          # The key carries every input that shapes an executed output: the
          # pages, the library source and lockfile, and the plot style the
          # pages load at run time. A cached render is only valid for the
          # build that produced it, so a change to any of them re-executes.
          key: docs-notebooks-${{ hashFiles('docs/tutorials/**', 'docs/explanation/**', 'docs/api/**', 'docs/_static/superglm.mplstyle', 'src/**', 'uv.lock') }}

      - name: Build with execution
        env:
          SUPERGLM_DOCS_EXECUTE: cache
        run: uv run sphinx-build -b html -n -W --keep-going -d docs/_build/doctrees docs docs/_build/html


      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: docs/_build/html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
