name: Security / Supply Chain

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          languages: python

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Licence policy: a dependency a pull request adds or moves must carry a
      # permissive or weak-copyleft licence. GPL and AGPL are refused by being
      # absent; LGPL and MPL-2.0 bind only changes to their own files, not a
      # library that imports them. The list holds every licence the dependency
      # graph reports for uv.lock today, so an unlisted permissive one is added
      # here by hand. docutils, from the docs group, is exempt: its one GPL file
      # is an Emacs mode its wheel does not ship.
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: true
          allow-licenses: >-
            0BSD, Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-2-Clause,
            BSD-2-Clause-Views, BSD-3-Clause, BSL-1.0, CC-BY-4.0, CC0-1.0,
            HPND-Markus-Kuhn, ISC, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only,
            LGPL-3.0-or-later, LicenseRef-scancode-matplotlib-1.3.0,
            LicenseRef-scancode-public-domain-disclaimer, MIT, MIT-0, MIT-CMU,
            MPL-2.0, OFL-1.1, PSF-2.0, Python-2.0, Python-2.0.1, Zlib
          allow-dependencies-licenses: pkg:pypi/docutils

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Audit project dependency metadata
        run: uvx --from 'pip-audit==2.9.0' pip-audit . --strict --progress-spinner off

      - name: Audit locked dependencies (all extras and groups)
        run: |
          uv export --locked --all-extras --all-groups --no-emit-project \
            --format requirements.txt --output-file "$RUNNER_TEMP/audit-requirements.txt" --quiet
          uvx --from 'pip-audit==2.9.0' pip-audit \
            --requirement "$RUNNER_TEMP/audit-requirements.txt" \
            --require-hashes --disable-pip --strict --progress-spinner off

      # pip-audit sees only advisories in its database, so a re-resolution that moves a
      # package back to a vulnerable release can pass it; compare with the base lock.
      - name: No package below the base branch's lock
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          SUPERGLM_LOCK_BASE=FETCH_HEAD uv run --frozen --extra dev python -m pytest \
            tests/test_supply_chain_governance.py -k lock_change_never_moves -p no:cacheprovider

  package-audit:
    name: Build and inspect package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uvx --from 'build==1.2.2.post1' python -m build

      - name: Check package metadata
        run: uvx --from 'twine==7.0.0' twine check dist/*

      - name: Check wheel contents
        run: uvx --from 'check-wheel-contents==0.6.3' check-wheel-contents dist/*.whl

      - name: Inspect package archive entries
        run: python scripts/verify_release_artifacts.py dist

      - name: Upload inspected package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: package-dist
          path: dist/*
          retention-days: 30

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Generate CycloneDX SBOM
        run: |
          uv sync --extra dev
          uv run --with 'cyclonedx-bom==7.1.0' cyclonedx-py environment --output-format json --output-file cyclonedx-sbom.json

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cyclonedx-sbom
          path: cyclonedx-sbom.json
          retention-days: 30
