name: Security / Supply Chain

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a
        with:
          languages: python

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: true

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Audit project dependency metadata
        run: uvx --from 'pip-audit==2.9.0' pip-audit . --strict --progress-spinner off

  package-audit:
    name: Build and inspect package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uvx --from 'build==1.2.2.post1' python -m build

      - name: Check package metadata
        run: uvx --from 'twine==6.2.0' twine check dist/*

      - name: Check wheel contents
        run: uvx --from 'check-wheel-contents==0.6.3' check-wheel-contents dist/*.whl

      - name: Inspect package archive entries
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path


          def reject_bad_archive_names(names, archive):
              bad = []
              for name in names:
                  parts = Path(name).parts
                  if (
                      name.startswith("/")
                      or ".." in parts
                      or name.endswith((".exe", ".dll", ".so", ".dylib"))
                  ):
                      bad.append(name)
              if bad:
                  raise SystemExit(f"Unexpected entries in {archive}: {bad[:20]}")


          for wheel in Path("dist").glob("*.whl"):
              print(f"Inspecting {wheel}")
              with zipfile.ZipFile(wheel) as zf:
                  names = zf.namelist()
              reject_bad_archive_names(names, wheel)
              for name in names[:50]:
                  print(" ", name)

          for sdist in Path("dist").glob("*.tar.gz"):
              print(f"Inspecting {sdist}")
              with tarfile.open(sdist) as tf:
                  names = tf.getnames()
              reject_bad_archive_names(names, sdist)
              for name in names[:50]:
                  print(" ", name)
          PY

      - name: Upload inspected package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-dist
          path: dist/*
          retention-days: 30

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Generate CycloneDX SBOM
        run: |
          uv sync --extra dev
          uv run --with 'cyclonedx-bom==7.1.0' cyclonedx-py environment --output-format json --output-file cyclonedx-sbom.json

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cyclonedx-sbom
          path: cyclonedx-sbom.json
          retention-days: 30
