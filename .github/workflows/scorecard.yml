name: OpenSSF Scorecard

on:
  branch_protection_rule:
  push:
    branches: [master]
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name == 'branch_protection_rule' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 30

  upload-sarif:
    name: Upload Scorecard SARIF
    runs-on: ubuntu-latest
    needs: scorecard
    if: github.event_name == 'branch_protection_rule' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download Scorecard SARIF artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: scorecard-results

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          sarif_file: scorecard-results.sarif
