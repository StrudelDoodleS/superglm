name: CI

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "package-lock.json"
      - "jsconfig.json"
      - "tests/editor_frontend/**"
      - ".github/workflows/**"
      - ".test_durations"
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-compatibility:
    # Keep the 3.14 names listed in the Protect master ruleset.
    name: Python ${{ matrix.runtime.python-version }} · non-browser regression suite · balanced ${{ matrix.label }}${{ matrix.runtime.suffix }}
    runs-on: ${{ matrix.runtime.os }}
    # A hang limit, not a budget, set per runtime (hang-limit) so that its
    # slowest measured shard stays under about 80% of it. Over 15 runs on
    # 2026-11-09 to 11 the slowest shard took 7.5 minutes on Linux ARM64 and
    # 10.5-11.2 on Linux 3.12 and 3.14 and macOS, but 14.2 on Windows. A
    # Windows shard's mean is already 11-12 minutes, 74-79% of 15, so no split
    # leaves room for the 1.2-1.4x between shards of one run that every
    # runtime shows on refreshed durations; Windows gets 20.
    # The push run's Python 3.12 shards run under branch coverage, which on
    # 3.12 only coverage.py's trace-function core can measure (sys.monitoring
    # measures branches from 3.14). The same tests take 1.5-2x as long there,
    # 10-15 minutes a shard, so those four get 20 as well.
    timeout-minutes: ${{ github.event_name == 'push' && matrix.runtime.python-version == '3.12' && 20 || matrix.runtime.hang-limit }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        group: [1, 2, 3, 4]
        runtime:
          - python-version: "3.12"
            os: ubuntu-latest
            suffix: ""
            hang-limit: 15
          - python-version: "3.14"
            os: ubuntu-latest
            suffix: ""
            hang-limit: 15
          - python-version: "3.13"
            os: windows-2025
            suffix: " · Windows"
            hang-limit: 20
          - python-version: "3.13"
            os: macos-15
            suffix: " · macOS ARM64"
            hang-limit: 15
          - python-version: "3.13"
            os: ubuntu-24.04-arm
            suffix: " · Linux ARM64"
            hang-limit: 15
        include:
          - group: 1
            label: A
          - group: 2
            label: B
          - group: 3
            label: C
          - group: 4
            label: D

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Set up Python ${{ matrix.runtime.python-version }}
        run: uv python install ${{ matrix.runtime.python-version }}

      - name: Install all tested optional dependencies
        run: >-
          uv sync --locked --python ${{ matrix.runtime.python-version }}
          --extra dev --extra bench --extra plotting

      - name: Record native numerical platform
        run: >-
          uv run python -c "import platform, numpy as np;
          print(platform.platform(), platform.machine());
          print('float64', np.finfo(np.float64));
          print('longdouble', np.finfo(np.longdouble))"

      # Numba writes each compiled kernel beside its source (``__pycache__/*.nbi``
      # and ``*.nbc``) and reuses it while that source file's content and the CPU it
      # was compiled for are unchanged, so a fresh checkout recompiles every kernel a
      # shard reaches. Numba does not notice a change to a kernel's callee in another
      # file, so the key holds every package source file and the lock, with no
      # partial (restore-keys) match: a hit means byte-identical sources and
      # dependencies. The host CPU and its features are in the key because a
      # kernel compiled for one CPU is not reused on another, and the shard is too,
      # since each shard compiles what its own tests reach.
      - name: Name the host CPU for the numba kernel cache
        id: numba-host
        shell: bash
        run: >-
          uv run python -c "import hashlib, llvmlite.binding as ll;
          features = ll.get_host_cpu_features().flatten();
          print('cpu=' + ll.get_host_cpu_name() + '-' + hashlib.sha256(features.encode()).hexdigest()[:12])"
          >> "$GITHUB_OUTPUT"

      - name: Restore numba's compiled kernels for identical sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            src/superglm/**/__pycache__/*.nbi
            src/superglm/**/__pycache__/*.nbc
          key: >-
            numba-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.runtime.python-version }}-${{ steps.numba-host.outputs.cpu }}-shard${{ matrix.group }}-${{ hashFiles('uv.lock', 'src/superglm/**/*.py') }}

      # The runner mirrors local runs: a parallel pass with one BLAS/numba thread per
      # worker, then the few `threads` tests serially with the default pools.
      - name: Run duration-balanced regression shard
        if: github.event_name != 'push' || matrix.runtime.python-version != '3.12'
        run: >-
          uv run --with mpmath python scripts/run_test_suite.py -m "not browser and not docs"
          --splits 4 --group ${{ matrix.group }}
          --splitting-algorithm least_duration
          --junitxml=pytest-results.xml

      - name: Run duration-balanced coverage shard
        if: github.event_name == 'push' && matrix.runtime.python-version == '3.12'
        env:
          COVERAGE_FILE: .coverage.${{ matrix.group }}
        run: >-
          uv run --with mpmath python scripts/run_test_suite.py -m "not browser and not docs"
          --splits 4 --group ${{ matrix.group }}
          --splitting-algorithm least_duration
          --junitxml=pytest-results.xml
          --cov=superglm --cov-branch --cov-report=

      - name: Upload shard results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pytest-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.runtime.python-version }}-${{ matrix.group }}
          path: pytest-results*.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload coverage database
        if: github.event_name == 'push' && matrix.runtime.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-Linux-py312-${{ matrix.group }}
          path: .coverage.${{ matrix.group }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  python-floor:
    # Preserve the existing required context and gate it on the entire matrix
    # and the Polars floor.
    name: Python 3.12 · non-browser suite · version floor
    if: ${{ always() }}
    needs: [test-compatibility, polars-floor]
    runs-on: ubuntu-latest
    steps:
      - name: Require every compatibility shard and the Polars floor to pass
        env:
          TEST_RESULT: ${{ needs.test-compatibility.result }}
          POLARS_FLOOR_RESULT: ${{ needs.polars-floor.result }}
        run: python -c "import os, sys; sys.exit(any(os.environ[k] != 'success' for k in ('TEST_RESULT', 'POLARS_FLOOR_RESULT')))"

  polars-floor:
    # The lock holds the newest Polars, so the matrix never runs the declared
    # floor (`polars>=1.42.1` in pyproject.toml).  This job repeats the tests
    # that import Polars on the floor release, which pins its own matching
    # polars-runtime-32.  Raise the version here when the floor moves.
    name: Polars 1.42.1 floor · Polars-touching tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POLARS_FLOOR: "1.42.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install the locked environment with the matrix's optional dependencies
        run: uv sync --locked --python 3.13 --extra dev --extra bench --extra plotting

      - name: Run the Polars-touching tests on the Polars floor
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          NUMBA_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          uv run --no-sync --with "polars==${POLARS_FLOOR}" python -c "import os, polars; assert polars.__version__ == os.environ['POLARS_FLOOR'], polars.__version__"
          files=$(grep -rlE "import polars|importorskip\(.polars" tests --include='*.py' | sort)
          uv run --no-sync --with "polars==${POLARS_FLOOR}" pytest $files -q -rs -n logical --dist worksteal -m "not browser and not docs and not threads"

  coverage:
    name: Python 3.12 · combined branch coverage
    if: github.event_name == 'push'
    needs: test-compatibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install coverage tooling
        run: uv sync --locked --python 3.12 --extra dev

      - name: Download coverage databases
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: coverage-Linux-py312-*
          path: coverage-data
          merge-multiple: true

      - name: Combine coverage databases
        run: |
          uv run coverage combine coverage-data
          uv run coverage xml -o coverage.xml
          uv run coverage report

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  lint:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

  frontend-browser:
    name: frontend-browser
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --python 3.13 --extra dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend modules
        run: npm run check:frontend

      - name: Install Chromium
        # The runner image already carries Chromium's system libraries; --with-deps only
        # tops them up through apt. If the apt mirror is unreachable, install the browser
        # alone: a library that is really missing then fails the browser tests loudly.
        run: uv run playwright install --with-deps chromium || uv run playwright install chromium

      - name: Legacy browser tests
        run: uv run pytest tests/test_editor_browser.py -m browser --run-browser -q

      - name: Workspace browser tests
        run: uv run pytest tests/editor/ -m browser --run-browser -q
