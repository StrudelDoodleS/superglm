name: CI

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "package-lock.json"
      - "jsconfig.json"
      - "tests/editor_frontend/**"
      - ".github/workflows/**"
      - ".test_durations"
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "package-lock.json"
      - "jsconfig.json"
      - "tests/editor_frontend/**"
      - ".github/workflows/**"
      - ".test_durations"

permissions:
  contents: read

jobs:
  test-compatibility:
    name: Python ${{ matrix.python-version }} · complete non-browser suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: >-
          ${{ fromJSON(
            github.event_name == 'pull_request'
            && '["3.10"]'
            || '["3.10","3.11","3.12","3.14"]'
          ) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra dev

      - name: Run complete compatibility suite
        run: uv run --with pyarrow pytest tests/ -q -m "not browser"

  test-coverage:
    name: Python 3.13 · coverage shard ${{ matrix.label }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1
            label: A
          - group: 2
            label: B
          - group: 3
            label: C
          - group: 4
            label: D

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --python 3.13 --extra dev

      - name: Run duration-balanced coverage shard
        env:
          COVERAGE_FILE: .coverage.${{ matrix.group }}
        run: >-
          uv run --with pyarrow pytest tests/ -q -m "not browser"
          --splits 4 --group ${{ matrix.group }}
          --splitting-algorithm least_duration
          --cov=superglm --cov-branch --cov-report=

      - name: Upload coverage database
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-py313-${{ matrix.group }}
          path: .coverage.${{ matrix.group }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  coverage:
    name: Python 3.13 · combined branch coverage
    if: github.event_name == 'push'
    needs: test-coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install coverage tooling
        run: uv sync --python 3.13 --extra dev

      - name: Download coverage databases
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: coverage-py313-*
          path: coverage-data
          merge-multiple: true

      - name: Combine coverage databases
        run: |
          uv run coverage combine coverage-data
          uv run coverage xml -o coverage.xml
          uv run coverage report

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  lint:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --python 3.13 --extra dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend modules
        run: npm run check:frontend

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Legacy browser tests
        run: uv run pytest tests/test_editor_browser.py -m browser --run-browser -q

      - name: Workspace browser tests
        run: uv run pytest tests/editor/ -m browser --run-browser -q
