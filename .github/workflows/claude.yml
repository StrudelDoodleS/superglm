name: Claude PR Review

on:
  # Every pull request gets a full review when it opens, reopens, leaves draft
  # or receives a push; `@claude` comments still ask ad-hoc questions.
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude-review:
    # Fork and Dependabot pull requests get no secrets, so they cannot run it.
    # The action refuses bot actors, and a refused run would still cancel the
    # review of the previous push in this pull request's concurrency group.
    if: |
      (github.event_name == 'pull_request' &&
       !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       github.event.sender.type != 'Bot') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body, '@claude'))
    # A newer push supersedes the review of an older one; comment-triggered runs
    # each get their own group so they are never cancelled.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('claude-review-pr-{0}', github.event.pull_request.number) || format('claude-review-run-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # Tag mode fetches the PR branch before configuring its own authentication
      # (https://github.com/anthropics/claude-code-action/issues/1236). This helper
      # reads the action's short-lived token at fetch time without storing it in Git config.
      - name: Configure temporary fetch authentication
        shell: bash
        run: |
          helper_path="${RUNNER_TEMP}/claude-fetch-credential"
          printf '%s\n' \
            '#!/bin/sh' \
            'echo username=x-access-token' \
            'echo "password=${DEFAULT_WORKFLOW_TOKEN}"' \
            > "${helper_path}"
          chmod 700 "${helper_path}"
          git config --local --unset-all credential.helper || true
          git config --local --add credential.helper ""
          git config --local --add credential.helper "${helper_path}"

      # Review with the newest Claude Code rather than the version the action
      # bundles, so newly released models work without waiting for a release.
      - name: Install latest Claude Code
        id: claude-code
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          "${HOME}/.local/bin/claude" --version
          echo "path=${HOME}/.local/bin/claude" >> "${GITHUB_OUTPUT}"

      - name: Run Claude PR review
        id: claude
        uses: anthropics/claude-code-action@9ca9355b36297178e28d37c799d1c9c8a28e6507 # v1 (main)
        env:
          AUTOMATIC_REVIEW_BRIEF: |
            Review this pull request thoroughly: every commit against the base
            branch, not only the latest push. Report, in this order:
            1. Correctness defects: wrong numbers, broken invariants, lost
               behaviour, error paths that cannot be reached or are unhandled.
            2. Test adequacy: tests that would still pass against the unfixed
               code, and tolerances that are not derived from an error analysis
               or a recorded measurement.
            3. AGENTS.md compliance: numerical policy, performance evidence for
               anything that changes time to fit, and the release-impact
               declaration in the description.
            Put each finding as an inline comment on the exact line, with a
            severity, and summarise all of them in the tracking comment. If an
            earlier review on this pull request raised findings, say which are
            now fixed.
        with:
          # On pull_request events, track_progress runs the same tag mode as an
          # @claude comment (one tracking comment, edited in place) and appends
          # the brief as custom instructions. Comment events keep the comment
          # body as the brief.
          track_progress: ${{ github.event_name == 'pull_request' }}
          prompt: ${{ github.event_name == 'pull_request' && env.AUTOMATIC_REVIEW_BRIEF || '' }}
          path_to_claude_code_executable: ${{ steps.claude-code.outputs.path }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Avoid embedding the Claude App token in the Git remote. Commit tools stay denied.
          use_commit_signing: true
          settings: |
            {
              "permissions": {
                "deny": [
                  "Read(/.git/**)",
                  "Read(//**/.git/**)",
                  "Read(//proc/**)",
                  "Read(~/.ssh/**)",
                  "Read(~/.config/gh/**)",
                  "Read(~/.claude/**)"
                ]
              }
            }
          additional_permissions: |
            contents: read
            pull_requests: write
            issues: write
            actions: read
          claude_args: |
            --model "claude-opus-5-5"
            --effort "xhigh"
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash,Edit,Write,MultiEdit,NotebookEdit,Agent,Task,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
            --append-system-prompt "Act only as a code reviewer. Do not modify files, create commits, or push branches. Return review feedback through PR comments only."
