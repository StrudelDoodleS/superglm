name: Claude PR Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude-review:
    if: |
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # Tag mode fetches the PR branch before configuring its own authentication
      # (https://github.com/anthropics/claude-code-action/issues/1236). This helper
      # reads the action's short-lived token at fetch time without storing it in Git config.
      - name: Configure temporary fetch authentication
        shell: bash
        run: |
          helper_path="${RUNNER_TEMP}/claude-fetch-credential"
          printf '%s\n' \
            '#!/bin/sh' \
            'echo username=x-access-token' \
            'echo "password=${DEFAULT_WORKFLOW_TOKEN}"' \
            > "${helper_path}"
          chmod 700 "${helper_path}"
          git config --local --unset-all credential.helper || true
          git config --local --add credential.helper ""
          git config --local --add credential.helper "${helper_path}"

      - name: Run Claude PR review
        id: claude
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Avoid embedding the Claude App token in the Git remote. Commit tools stay denied.
          use_commit_signing: true
          settings: |
            {
              "permissions": {
                "deny": [
                  "Read(/.git/**)",
                  "Read(//**/.git/**)",
                  "Read(//proc/**)",
                  "Read(~/.ssh/**)",
                  "Read(~/.config/gh/**)",
                  "Read(~/.claude/**)"
                ]
              }
            }
          additional_permissions: |
            contents: read
            pull_requests: write
            issues: write
            actions: read
          claude_args: |
            --model "claude-opus-5"
            --effort "max"
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash,Edit,Write,MultiEdit,NotebookEdit,Agent,Task,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
            --append-system-prompt "Act only as a code reviewer. Do not modify files, create commits, or push branches. Return review feedback through PR comments only."
