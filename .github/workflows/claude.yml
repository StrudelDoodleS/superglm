name: Claude PR Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude-review:
    if: |
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare complete PR diff for review
        if: github.event_name == 'pull_request_review'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p .claude-review
          git diff --no-ext-diff --no-textconv "${PR_BASE_SHA}...${PR_HEAD_SHA}" > .claude-review/full.diff
          git diff --stat "${PR_BASE_SHA}...${PR_HEAD_SHA}" > .claude-review/stat.txt
          printf '%s\n' "${PR_BASE_SHA}" "${PR_HEAD_SHA}" > .claude-review/revisions.txt

      # Tag mode fetches the PR branch before configuring its own authentication
      # (https://github.com/anthropics/claude-code-action/issues/1236). This helper
      # reads the action's short-lived token at fetch time without storing it in Git config.
      - name: Configure temporary fetch authentication
        shell: bash
        run: |
          helper_path="${RUNNER_TEMP}/claude-fetch-credential"
          printf '%s\n' \
            '#!/bin/sh' \
            'echo username=x-access-token' \
            'echo "password=${DEFAULT_WORKFLOW_TOKEN}"' \
            > "${helper_path}"
          chmod 700 "${helper_path}"
          git config --local --unset-all credential.helper || true
          git config --local --add credential.helper ""
          git config --local --add credential.helper "${helper_path}"

      - name: Run Claude PR review
        id: claude
        uses: anthropics/claude-code-action@0a8d3c9443bbff909ab973b6a17a340b913f229f # v1, Claude Code 2.1.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Avoid embedding the Claude App token in the Git remote. Commit tools stay denied.
          use_commit_signing: true
          settings: |
            {
              "switchModelsOnFlag": false,
              "permissions": {
                "deny": [
                  "Read(/.git/**)",
                  "Read(//**/.git/**)",
                  "Read(//proc/**)",
                  "Read(~/.ssh/**)",
                  "Read(~/.config/gh/**)",
                  "Read(~/.claude/**)"
                ]
              }
            }
          additional_permissions: |
            contents: read
            pull_requests: write
            issues: write
            actions: read
          claude_args: |
            --model "claude-fable-5-1"
            --effort "max"
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash,Edit,Write,MultiEdit,NotebookEdit,Agent,Task,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
            --append-system-prompt "Act only as a code reviewer. Do not modify files, create commits, or push branches. Return review feedback through PR comments only."

      - name: Report Claude startup errors
        if: failure() && steps.claude.outputs.execution_file != ''
        env:
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          messages = json.loads(Path(os.environ["CLAUDE_EXECUTION_FILE"]).read_text())
          for message in messages:
              if message.get("type") == "result" and message.get("is_error"):
                  summary = {key: message.get(key) for key in (
                      "subtype", "api_error_status", "result", "errors"
                  )}
                  text = json.dumps(summary)
                  text = re.sub(r"sk-ant-[\w-]+|gh[pousr]_[\w]+|github_pat_[\w]+", "[redacted]", text)
                  text = re.sub(r"(?i)bearer\s+[^\s\"\\]+", "Bearer [redacted]", text)
                  print(text[:4000])
          PY
