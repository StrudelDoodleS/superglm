name: Cache cleanup

# A pull request's caches are scoped to refs/pull/<number>/merge, so only that
# pull request's re-runs can restore them. Left in place they count against
# the repository's 10 GB cache limit for a week, and GitHub evicts the oldest
# entries to make room, master's numba kernel caches among them. This deletes
# a pull request's caches when it closes, as GitHub's documentation describes
# ("Force deleting cache entries" in "Managing caches"). It checks out no code
# and runs none from the pull request. A fork's pull request gets a read-only
# token, so its deletions fail and the job still succeeds.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete-pull-request-caches:
    name: Delete the closed pull request's caches
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete every cache scoped to the pull request's merge ref
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          ids=$(gh cache list --ref "$REF" --limit 1000 --json id --jq '.[].id')
          for id in $ids; do
            gh cache delete "$id" || echo "could not delete cache $id"
          done
