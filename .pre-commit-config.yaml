repos:
  # ── Standard hygiene ────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2000"]
        exclude: '\.ipynb$'

  # ── Ruff (lint + format) ────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ── Tests (pre-push only) ───────────────────────────────────
  - repo: local
    hooks:
      - id: pytest
        name: pytest-fast
        entry: uv run --extra dev python scripts/run_test_suite.py -m "not slow and not docs"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # ── Docstrings and documentation notebooks ──────────────────
  - repo: https://github.com/numpy/numpydoc
    rev: v1.10.0
    hooks:
      - id: numpydoc-validation
        files: ^src/superglm/
        # The editor is a browser application, not part of the documented
        # modelling API, so its handlers are not held to numpydoc rules.
        exclude: ^src/superglm/editor/

  - repo: https://github.com/mwouts/jupytext
    rev: v1.19.5
    hooks:
      - id: jupytext
        args: [--sync]
        files: ^docs/tutorials/.*\.md$

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        files: ^docs/tutorials/.*\.ipynb$
