[project]
name = "superglm"
version = "0.43.0"
description = "Penalised GLMs for insurance pricing: group lasso, P-splines, Tweedie"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Max Hicks" },
]
keywords = [
    "actuarial",
    "generalized-additive-models",
    "generalized-linear-models",
    "insurance-pricing",
    "splines",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

# Each floor is the oldest release the quick suite passes on, run on Python 3.12
# by CI's dependency-floors job. Newer Pythons start higher where an older
# release ships no wheel for them: on 3.13 scikit-learn 1.5.2; on 3.14 numpy
# 2.3.3, scipy 1.16.1, numba 0.63.0, matplotlib 3.10.5 and scikit-learn 1.7.2.
dependencies = [
    "numpy>=2.3",
    "scipy>=1.15",
    # Under pandas 2 a model saved under pandas 3 does not load, and a datetime
    # level quoted as a string routes to the base level.
    "pandas>=3.0",
    "narwhals>=2.17.0",
    "numba>=0.62",
    # Imported directly (llvmlite.binding.add_symbol registers LAPACK for numba
    # kernels); numba pins the minor, and 0.45 is the one numba 0.62 needs.
    "llvmlite>=0.45",
    "matplotlib>=3.10",
    "scikit-learn>=1.4.2",
    "joblib>=1.6.0",
    "tabmat>=4.2.1",
    "threadpoolctl>=3.1",
    # pandas 3 refuses an older openpyxl for Excel files.
    "openpyxl>=3.1.5",
    "fastapi>=0.115",
    # Imported directly for its HTTPException; 0.37.2 is fastapi 0.115's own floor.
    "starlette>=0.37.2",
    "uvicorn>=0.30",
]

[project.urls]
Documentation = "https://strudeldoodles.github.io/superglm/"
Homepage = "https://github.com/StrudelDoodleS/superglm"
Issues = "https://github.com/StrudelDoodleS/superglm/issues"
Repository = "https://github.com/StrudelDoodleS/superglm"

[project.optional-dependencies]
dev = [
    "playwright>=1.55",
    "psutil>=7.2",
    # pandas.read_parquet needs an engine; without one the real-data suites
    # raise ImportError from inside the test body instead of skipping, so a
    # developer holding the gitignored parquet still gets no coverage. 18, as
    # pyarrow 17 installs a top-level `benchmarks` package that shadows ours.
    "pyarrow>=18",
    "pytest>=9.0",
    # pytest-cov and pre-commit had no floor, so the resolver picked releases years
    # old; their floors are releases the suite passes on, not measured minima.
    "pytest-cov>=7.0",
    "pytest-split>=0.11.0",
    "pytest-xdist>=3.8",
    "pyyaml>=6.0.1",
    "ruff==0.16.3",
    # Test-only derivative oracle (tests/test_family_derivatives_symbolic.py);
    # src/superglm never imports it. Floor by SPEC 0: 1.14 (2025-04-27) is the
    # oldest minor released within 24 months; 1.13 (2024-07-08) is outside.
    # It brings mpmath (<1.4), which the importorskip("mpmath") oracles use.
    "sympy>=1.14",
    "ty==0.0.72",
    "polars>=1.42.1",
    "pre-commit>=4.0",
    "superglm[notebook]",
]
bench = [
    "glum>=3.4.1",
    # 0.14.6 is the first that runs on pandas 3.
    "statsmodels>=0.14.6",
    # Kept byte-identical to the dev floor above, and asserted in
    # test_the_two_pyarrow_floors_are_declared_identically. Dependabot resolves
    # a package to one requirement string, so a disagreement here is rewritten
    # into dev on any pull request that touches pyarrow. Nothing in benchmarks/
    # imports pyarrow directly -- it reaches it through pandas.read_parquet --
    # so this entry declares presence rather than an API version.
    "pyarrow>=18",
]
plotting = [
    "plotly>=5.24",
]
# The editor inside a notebook cell (EditorSession.widget(mode="notebook")),
# for hosted notebooks such as Databricks whose browser cannot reach a local
# server.
notebook = [
    "anywidget>=0.10",
    # The notebook view declares its synced state with traitlets directly.
    "traitlets>=5.0",
]

[tool.uv]
required-version = "==0.12.1"
# Dependency cooldown: every resolution ignores files uploaded in the last
# seven days, so a lock bump takes only releases that have been public that
# long (uv docs, "Resolution: dependency cooldowns"). A security fix younger
# than that gets a per-package cutoff just after the fixing release's upload,
# which admits that release and nothing newer, listed with its advisories in
# tests/test_supply_chain_governance.py; drop it once the window has passed it.
exclude-newer = "7 days"
# tornado 6.6.1 (uploaded 2026-11-09T21:09:22Z) fixes GHSA-5cjw-f85j-cv6r.
exclude-newer-package = { tornado = "2026-11-09T21:10:00Z" }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/superglm"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

# ── ruff ────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs/examples"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "NPY",  # numpy-specific
]
ignore = [
    "E501",  # line too long (let formatter handle it)
    "N802",  # function name should be lowercase (we use _compute_R_inv, _wrap_dense_X etc.)
    "N803",  # argument name should be lowercase (we use X, B, etc.)
    "N806",  # variable in function should be lowercase (same)
]

[tool.ruff.lint.isort]
known-first-party = ["superglm"]

[tool.ruff.lint.pyflakes]
# Imported ahead of a package that enters them through a submodule, not for a name they bind
# (_ENTER_FIRST and _PARENT_FIRST in tests/test_import_compat.py).
allowed-unused-imports = ["html", "numba", "numpy.random", "scipy.linalg", "scipy.spatial"]

# ── pytest ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
norecursedirs = ["scratch"]
markers = [
    "browser: runs real-browser editor integration tests",
    "slow: marks tests that fit real models (deselect with '-m \"not slow\"')",
    "docs: executes documentation notebooks (deselect with '-m \"not docs\"')",
    "threads: needs the default thread pools; run serially and unpinned by scripts/run_test_suite.py",
    "pins_behaviour: a control that deliberately pins behaviour that already worked before the change; its docstring says what it pins (scripts/check_fix_tests.py fails a pull request on any other added or changed test that passes on its base)",
]
filterwarnings = [
    "ignore:Spline\\(kind='bs'\\):FutureWarning",
]

# ── coverage ────────────────────────────────────────────────────
[tool.coverage.run]
source = ["superglm"]
branch = true
omit = ["src/superglm/plotting/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

# ── ty ───────────────────────────────────────────────────────────
[tool.ty.src]
include = ["src/superglm"]

[dependency-groups]
docs = [
    "sphinx>=9.1,<10",
    "pydata-sphinx-theme>=0.21",
    "myst-nb>=1.4",
    "numpydoc>=1.10",
    "sphinx-design>=0.7",
    "sphinx-copybutton>=0.5",
    "sphinxext-rediraffe>=0.3",
    "jupytext>=1.19",
    "nbstripout>=0.9",
    "ipykernel>=6.0",
]

# ── numpydoc docstring validation (pre-commit) ──────────────────
[tool.numpydoc_validation]
checks = ["GL08"]
# The hook names objects `<module stem>.<qualname>`, so the patterns below
# match on that shape rather than on a dotted import path.
exclude = [
    '^_',                       # private modules
    '\._',                      # private members and dunders
    '^[^.]+\.[^.]+\.',          # methods and nested functions: the hook reads
                                # the file with ast, so it cannot see a
                                # docstring inherited from a base class or a
                                # Protocol, which is where the method
                                # documentation of this package lives
]
