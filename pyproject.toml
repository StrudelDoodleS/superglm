[project]
name = "superglm"
version = "0.28.0"
description = "Penalised GLMs for insurance pricing: group lasso, P-splines, Tweedie"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Max Hicks" },
]
keywords = [
    "actuarial",
    "generalized-additive-models",
    "generalized-linear-models",
    "insurance-pricing",
    "splines",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "narwhals>=2.17.0",
    "numba>=0.57",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "tabmat>=4.2.1",
    "threadpoolctl>=3.1",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.urls]
Documentation = "https://strudeldoodles.github.io/superglm/"
Homepage = "https://github.com/StrudelDoodleS/superglm"
Issues = "https://github.com/StrudelDoodleS/superglm/issues"
Repository = "https://github.com/StrudelDoodleS/superglm"

[project.optional-dependencies]
dev = [
    "playwright>=1.55",
    "psutil>=7.2",
    # pandas.read_parquet needs an engine; without one the real-data suites
    # raise ImportError from inside the test body instead of skipping, so a
    # developer holding the gitignored parquet still gets no coverage.
    "pyarrow>=17",
    "pytest>=7.0",
    "pytest-cov",
    "pytest-split>=0.11.0",
    "ruff==0.16.1",
    "ty==0.0.66",
    "polars>=1.42.1",
    "pre-commit",
]
bench = [
    "glum>=3.4.1",
    "statsmodels>=0.14",
    "pyarrow>=10.0",
]
plotting = [
    "plotly>=5.24",
]

[tool.uv]
required-version = "==0.12.1"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/superglm"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

# ── ruff ────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs/notebooks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "NPY",  # numpy-specific
]
ignore = [
    "E501",  # line too long (let formatter handle it)
    "N802",  # function name should be lowercase (we use _compute_R_inv, _wrap_dense_X etc.)
    "N803",  # argument name should be lowercase (we use X, B, etc.)
    "N806",  # variable in function should be lowercase (same)
]

[tool.ruff.lint.isort]
known-first-party = ["superglm"]

# ── pytest ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
norecursedirs = ["scratch"]
markers = [
    "browser: runs real-browser editor integration tests",
    "slow: marks tests that fit real models (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore:Spline\\(kind='bs'\\):FutureWarning",
]

# ── coverage ────────────────────────────────────────────────────
[tool.coverage.run]
source = ["superglm"]
branch = true
omit = ["src/superglm/plotting/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

# ── ty ───────────────────────────────────────────────────────────
[tool.ty.src]
include = ["src/superglm"]

[dependency-groups]
docs = [
    "mkdocs-material>=9.7.5",
    "mkdocstrings[python]>=1.0.3",
    "mkdocs-jupyter>=0.25.0",
    "nbconvert>=7.0",
    "nbformat>=5.0",
    "ipykernel>=6.0",
]
